[package]
name = "pinocchio-example-entrypoint-user-registry"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
description = "An example Pinocchio program that uses the `entrypoint!` macro"
readme = "./README.md"
repository = { workspace = true }
license = { workspace = true }

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { path = "../../sdk/pinocchio" }
pinocchio-macro = { path = "../../sdk/pinocchio-macro" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("frozen-abi", "no-entrypoint", "custom-heap", "custom-panic"))',
]
